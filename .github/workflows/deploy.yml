name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: node scripts/build-gh-pages.mjs

      - name: Deploy to gh-pages branch
        run: |
          cd dist/gh-pages
          git init -q
          git config user.name "LiuYUX0512"
          git config user.email "5399301912@163.com"
          git add -A
          git commit -m "deploy: auto build ${GITHUB_SHA::7} at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages