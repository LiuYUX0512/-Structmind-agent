<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="面向建筑方案阶段的多Agent协同结构选型与优化工具，基于土木工程专业知识库智能生成多套候选方案并给出综合推荐。" />
    <meta name="theme-color" content="hsl(213 85% 38%)" />
    <title>智构 StructMind · 建筑结构方案优化AI智能体</title>

    <!-- Open Graph -->
    <meta property="og:title" content="智构 StructMind · 建筑结构方案优化AI智能体" />
    <meta property="og:description" content="面向建筑方案阶段的多Agent协同结构选型与优化工具" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <style>
      /* 应用启动前的深蓝工程蓝图加载画面（JS 加载完毕后被 React 替换） */
      #root:empty::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse at center, rgba(45, 212, 191, 0.12) 0%, transparent 60%),
          linear-gradient(135deg, #020617 0%, #0f172a 50%, #020617 100%);
        z-index: 0;
      }
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(45, 212, 191, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(45, 212, 191, 0.07) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: 1;
        pointer-events: none;
      }
      #root {
        position: relative;
      }
      #boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        z-index: 10;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft Yahei', sans-serif;
      }
      #boot-loading .boot-icon {
        position: relative;
        width: 80px;
        height: 80px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(45, 212, 191, 0.2), rgba(45, 212, 191, 0.05));
        border: 1px solid rgba(45, 212, 191, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        animation: boot-pulse 2s ease-in-out infinite;
        box-shadow: 0 0 40px rgba(45, 212, 191, 0.15);
      }
      #boot-loading .boot-icon::before,
      #boot-loading .boot-icon::after {
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 1px solid rgba(45, 212, 191, 0.25);
        animation: boot-ring 2.5s ease-out infinite;
      }
      #boot-loading .boot-icon::after {
        animation-delay: 0.6s;
      }
      #boot-loading .boot-icon svg {
        width: 40px;
        height: 40px;
        stroke: #2dd4bf;
        fill: none;
        stroke-width: 1.2;
      }
      #boot-loading .boot-title {
        color: #f1f5f9;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 2px;
        text-align: center;
      }
      #boot-loading .boot-title span {
        background: linear-gradient(90deg, #2dd4bf, #06b6d4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-left: 10px;
        font-weight: 800;
      }
      #boot-loading .boot-tags {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
      }
      #boot-loading .boot-tag {
        padding: 4px 14px;
        border: 1px solid rgba(45, 212, 191, 0.3);
        border-radius: 999px;
        color: rgba(45, 212, 191, 0.8);
        font-size: 11px;
        letter-spacing: 1px;
        background: rgba(45, 212, 191, 0.08);
      }
      #boot-loading .boot-bar {
        width: 320px;
        height: 2px;
        background: rgba(45, 212, 191, 0.1);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      #boot-loading .boot-bar::before {
        content: '';
        position: absolute;
        left: -40%;
        top: 0;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #2dd4bf, #67e8f9, #2dd4bf, transparent);
        border-radius: 2px;
        animation: boot-progress 1.8s ease-in-out infinite;
        box-shadow: 0 0 10px rgba(45, 212, 191, 0.5);
      }
      #boot-loading .boot-subtitle {
        color: rgba(148, 163, 184, 0.5);
        font-size: 11px;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      #boot-loading .boot-tagline {
        color: rgba(148, 163, 184, 0.35);
        font-size: 10px;
        letter-spacing: 5px;
        margin-top: 4px;
      }
      @keyframes boot-pulse {
        0%, 100% { box-shadow: 0 0 30px rgba(45, 212, 191, 0.15); }
        50% { box-shadow: 0 0 60px rgba(45, 212, 191, 0.3); }
      }
      @keyframes boot-ring {
        0% { transform: scale(1); opacity: 0.5; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes boot-progress {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loading .boot-icon,
        #boot-loading .boot-icon::before,
        #boot-loading .boot-icon::after,
        #boot-loading .boot-bar::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loading" aria-label="应用加载中">
        <div class="boot-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 9h.01M15 9h.01M12 9h.01"/>
          </svg>
        </div>
        <div>
          <div class="boot-title">结构方案优化工作台<span>AI</span></div>
        </div>
        <div class="boot-tags">
          <span class="boot-tag">多权重点位</span>
          <span class="boot-tag">规范校验</span>
          <span class="boot-tag">智能比选</span>
        </div>
        <div class="boot-bar"></div>
        <div class="boot-subtitle">Structural Optimization Workbench</div>
        <div class="boot-tagline">为人民建好房 · 为工友谋幸福</div>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
